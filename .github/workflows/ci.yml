name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && python -m pytest -q
      - run: python agent/cit_agent.py --selftest
      - run: python worker/cit_worker.py selftest
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd frontend && npm ci && npm test && npm run build
  deploy-config:  # validates the Docker/Caddy files; builds the images (first run = first verification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp deploy/.env.example deploy/.env && docker compose -f deploy/docker-compose.yml config -q
      - run: docker build -f deploy/Dockerfile.backend -t cit-backend .
      - run: docker build -f deploy/Dockerfile.web -t cit-web .
  windows-installer:  # UNTESTED until first run on GitHub
    needs: [backend, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -r backend/requirements.txt pyinstaller
      - name: Build backend sidecar
        shell: bash
        run: |
          cd backend && pyinstaller --onefile --name cit-backend -p . app/main.py
          mkdir -p ../src-tauri/binaries
          cp dist/cit-backend.exe ../src-tauri/binaries/cit-backend-x86_64-pc-windows-msvc.exe
      - run: cd frontend && npm ci
      - run: npx --yes @tauri-apps/cli@2 build  # run from repo root so src-tauri/ is discovered
        # Signing: provide a code-signing certificate via secrets; the installer is UNSIGNED otherwise.
      - uses: actions/upload-artifact@v4
        with: { name: installer, path: src-tauri/target/release/bundle/nsis/*.exe }
  agent-windows:  # builds the portable agent and runs its self-test on a real Windows runner
    needs: [backend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt pyinstaller
      - run: pyinstaller --onefile --name cit-agent -p backend agent/cit_agent.py
      - name: Selftest (TLS pinning, pairing, confinement, default-deny grants, disconnect)
        run: dist\cit-agent.exe --selftest
      - name: Assemble portable USB folder
        shell: bash
        run: |
          mkdir -p portable && cp dist/cit-agent.exe agent/portable/start-agent.bat agent/portable/README-USB.txt portable/
      - uses: actions/upload-artifact@v4
        with: { name: cit-agent-portable, path: portable/* }
  worker-windows:  # builds the Worker Station and runs its selftest on a real Windows runner (DPAPI path is NOT covered by the selftest)
    needs: [backend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt pyinstaller
      - run: pyinstaller --onefile --name cit-worker -p backend worker/cit_worker.py
      - name: Windows-only checks (DPAPI round trip, enroll, restart keeps identity)
        run: python worker/windows_check.py dist\cit-worker.exe
      - uses: actions/upload-artifact@v4
        with: { name: cit-worker, path: dist/cit-worker.exe }
