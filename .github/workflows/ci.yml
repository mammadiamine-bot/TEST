name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd frontend && npm ci && npm test && npm run build
  windows-installer:  # UNTESTED until first run on GitHub
    needs: [backend, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -r backend/requirements.txt pyinstaller
      - name: Build backend sidecar
        shell: bash
        run: |
          cd backend && pyinstaller --onefile --name cit-backend -p . app/main.py
          mkdir -p ../src-tauri/binaries
          cp dist/cit-backend.exe ../src-tauri/binaries/cit-backend-x86_64-pc-windows-msvc.exe
      - run: cd frontend && npm ci && npm i -D @tauri-apps/cli@2
      - run: cd frontend && npx tauri build --config ../src-tauri/tauri.conf.json
        # Signing: provide a code-signing certificate via secrets; the installer is UNSIGNED otherwise.
      - uses: actions/upload-artifact@v4
        with: { name: installer, path: src-tauri/target/release/bundle/nsis/*.exe }
